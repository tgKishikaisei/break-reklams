name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Проверки и unit-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Невидимые символы, пробелы, переводы строк
        run: npm run lint:text
      - name: Unit-тесты парсера фильтров
        run: npm test
      - name: Собранные правила совпадают с filters/
        run: |
          npm run build
          git diff --exit-code -- extension ':!extension/data/meta.json' \
            || (echo "::error::Правила не пересобраны: выполните npm run build и закоммитьте результат" && exit 1)

  e2e:
    name: Сквозной тест в Chrome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Запуск расширения в headless Chrome
        run: CHROME="$(command -v google-chrome)" E2E_OUT="$RUNNER_TEMP/e2e" npm run e2e
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
