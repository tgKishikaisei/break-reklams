  <script>
    window.__results = {};
    setTimeout(() => {
      const late = document.createElement('div');

    window.dataLayer = window.dataLayer || [];
    dataLayer.push({ event: 'test', eventCallback: () => { window.__results.gtmCallback = true; } });
    googletag.cmd.push(() => {
      googletag.defineSlot('/1/test', [300, 250], 'div-gpt-ad-123').addService(googletag.pubads());
      googletag.enableServices();
      googletag.display('div-gpt-ad-123');
      window.__results.gptChain = true;
    });
    (window.adsbygoogle = window.adsbygoogle || []).push({});
